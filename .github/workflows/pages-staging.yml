name: Deploy staging to GitHub Pages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run regression tests
        # The golden DWG suite uses libredwg's native Node path, which returns
        # error 64 on GitHub's Linux runner. Browser staging still uses WASM.
        # Keep all deterministic geometry/export/beam regressions blocking;
        # run the real-DWG golden suite separately on its supported runner.
        run: npm test -- --exclude tests/golden.test.ts

      - name: Build browser-processing staging app
        run: npm run build
        env:
          QSS_BASE_PATH: /qss-civil-pro/
          VITE_QSS_REMOTE_PROCESSING: "false"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

